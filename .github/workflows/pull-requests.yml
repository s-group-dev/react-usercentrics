name: Pull Requests

on:
    pull_request:

permissions:
    contents: read

jobs:
    Install:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - uses: actions/cache@v4
              id: cache-node_modules
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - if: steps.cache-node_modules.outputs.cache-hit != 'true'
              run: npm ci

    Test:
        needs:
            - Install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - uses: actions/cache@v4
              id: cache-node_modules
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npm run test

    Lint:
        needs:
            - Install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - uses: actions/cache@v4
              id: cache-node_modules
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npm run lint

    Typecheck:
        needs:
            - Install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - uses: actions/cache@v4
              id: cache-node_modules
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npm run typecheck

    Build:
        needs:
            - Install
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - uses: actions/cache@v4
              id: cache-node_modules
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - run: npm run build

    Release-dry-run:
        name: Release (dry-run)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - uses: actions/cache@v4
              id: cache-node_modules
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
            - name: semantic-release --dry-run
              run: |
                  unset GITHUB_ACTIONS
                  npx semantic-release --dry-run --no-ci --branches "${GITHUB_HEAD_REF}"
              env:
                  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
                  GIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
                  GIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
                  GIT_GIT_COMMITTER_NAME_NAME: ${{ github.event.head_commit.committer.name }}
                  GIT_GIT_COMMITTER_NAME_EMAIL: ${{ github.event.head_commit.committer.email }}
